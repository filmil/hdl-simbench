name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # The correctness checks: every simulator must run every case to the
      # expected cycle count and output. Timed runs are not done in CI.
      - name: Test
        run: bazel test --lockfile_mode=error //...
